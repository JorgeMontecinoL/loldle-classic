# Continuación del fine-tuning (ronda 2), desde el adaptador de la ronda 1.
#
# Por qué: en validación la ronda 1 seguía mejorando al terminar (resueltas
# 0 -> 2 -> 6 -> 7 de 15 en las iteraciones 100/300/500/700), pero casi la mitad
# de sus jugadas eran repeticiones. Repetir un campeón no aporta información,
# el estado no cambia y con decodificación greedy el modelo vuelve a proponer
# lo mismo hasta agotar los intentos; ningún ejemplo de la ronda 1 tenía un
# historial con repeticiones. La ronda 2 añade 3 por objetivo, más trayectorias
# con errores nuevas:
#   python3 finetune/make_data.py --format reasoned --sample-seed 2027 \
#       --noisy-per-target 4 --repeats-per-target 3 --out reasoned_round2
# La partición no cambia y la validación es la misma de la ronda 1.
#
#   .venv-ft/bin/python -m mlx_lm lora --config finetune/lora_config_round2.yaml

model: mlx-community/Ministral-3-3B-Instruct-2512-4bit
train: true
data: finetune/data/reasoned_round2
resume_adapter_file: finetune/adapters/ministral-3b-loldle/adapters.safetensors
adapter_path: finetune/adapters/ministral-3b-loldle-r2
seed: 2027

fine_tune_type: lora
num_layers: 12
lora_parameters:
  rank: 16
  scale: 20.0
  dropout: 0.05

mask_prompt: true
max_seq_length: 8192
grad_checkpoint: true

batch_size: 1
grad_accumulation_steps: 4
iters: 800                           # 200 actualizaciones
learning_rate: 1.5e-5
lr_schedule:
  name: cosine_decay
  warmup: 4
  warmup_init: 1.0e-6
  arguments: [1.5e-5, 196, 1.0e-6]

steps_per_report: 20
steps_per_eval: 100
val_batches: 30
save_every: 100
