# Entregable 4 · ronda 1 del adaptador del Selector (detenida en la iteración 1050 de 2503;
# se usa su punto de control 1000 como inicio de la ronda 2, ver lora_config_d4_selector_r2.yaml).
# Inicialización: el adaptador común del D3 (d3_paginas_cot3), que ya conoce el formato de
# página; se sigue entrenando sólo con ejemplos del Selector y sólo el Selector lo usa.
# Datos: finetune/make_data_d4.py (semilla 4040), 2.503 ejemplos de 128 secretos de
# entrenamiento; validación de pérdida con 95 ejemplos de los 15 secretos de validación.
#   .venv-ft/bin/python finetune/make_data_d4.py
#   .venv-ft/bin/python -m mlx_lm lora --config finetune/lora_config_d4_selector_r1.yaml
# El modelo base es MLX de 4 bits: LoRA sobre pesos cuantizados (QLoRA en la práctica).

model: mlx-community/Ministral-3-3B-Instruct-2512-4bit   # revisión a962dcb09eee4169c890e544c9eb938f1113fdee
train: true
data: finetune/data/d4_selector
resume_adapter_file: finetune/adapters/d3_paginas_cot3/adapters.safetensors
adapter_path: finetune/adapters/d4_selector_r1
seed: 4041

fine_tune_type: lora
num_layers: 12
lora_parameters:
  rank: 16
  scale: 20.0
  dropout: 0.05

mask_prompt: true                    # la pérdida sólo cuenta la respuesta del Selector
max_seq_length: 4096
grad_checkpoint: true

batch_size: 1
grad_accumulation_steps: 4
iters: 2503                          # una pasada: 2.503 ejemplos
learning_rate: 2.0e-5
lr_schedule:
  name: cosine_decay
  warmup: 8
  warmup_init: 1.0e-6
  arguments: [2.0e-5, 618, 2.0e-6]   # 618 pasos de optimizador (2.503 / 4 - warmup)

steps_per_report: 25
steps_per_eval: 250
val_batches: 95                      # toda la validación
save_every: 500
