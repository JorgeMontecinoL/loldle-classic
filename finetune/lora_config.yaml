# Fine-tuning LoRA de ministral-3-3b-instruct-2512 para LoLdle Classic.
# Formato de tres pasos: el modelo escribe lo confirmado hasta ahora ("Sé:"),
# los campeones compatibles en orden del roster, y juega el primero en la
# última línea. Al juego sólo llega esa última línea.
#
# Se lanza desde la raíz del repo:
#   .venv-ft/bin/python -m mlx_lm lora --config finetune/lora_config.yaml
#
# Hiperparámetros medidos en un M5 Pro de 64 GB (ejemplos de ~5.500 tokens):
#   - lote 1 × acumulación 4, LoRA en los 12 bloques superiores: ~10 s por
#     ejemplo y ~21 GB de pico (lote 4 en los 26 bloques: 70 s y 52 GB).
#   - tasa 2e-5: estable (1e-4 divergió; mlx-lm escala la salida LoRA ×20).
# Las alternativas "sólo nombre" (lora_answer_only.yaml) y "compatibles +
# jugada" (lora_candidates_only.yaml) usaron estos mismos valores: ver
# finetune/logs/ y el análisis del Entregable 2.

model: mlx-community/Ministral-3-3B-Instruct-2512-4bit   # mismos pesos que el baseline
train: true
data: finetune/data/reasoned         # make_data.py --format reasoned
adapter_path: finetune/adapters/ministral-3b-loldle
seed: 2026

fine_tune_type: lora
num_layers: 12                       # los 12 bloques superiores de 26
lora_parameters:
  rank: 16
  scale: 20.0
  dropout: 0.05

mask_prompt: true                    # la pérdida cae sólo en la respuesta
max_seq_length: 8192                 # el ejemplo más largo mide 7.363 tokens
grad_checkpoint: true

batch_size: 1
grad_accumulation_steps: 4           # lote efectivo de 4
iters: 700                           # ~0,84 épocas de 832 ejemplos = 175 actualizaciones
learning_rate: 2.0e-5
lr_schedule:
  name: cosine_decay
  warmup: 8                          # en actualizaciones del optimizador
  warmup_init: 1.0e-7
  arguments: [2.0e-5, 167, 2.0e-6]   # pico, pasos de decaimiento, mínimo

steps_per_report: 20
steps_per_eval: 100
val_batches: 30                      # 30 de los 65 ejemplos de validación
save_every: 100
